name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: app_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -prootpassword" --health-interval=5s --health-timeout=3s --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download & Verify Go Modules
        run: |
          go mod download
          go mod verify

      - name: Check Code Formatting
        run: |
          CHANGES=$(gofmt -s -l .)
          if [ -n "$CHANGES" ]; then
            echo "The following files are not properly formatted:"
            echo "$CHANGES"
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run Unit & Integration Tests (with Race Detector)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpassword
          MYSQL_DATABASE: app_db
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: go test -v -race ./...

      - name: Generate Code Coverage Report
        run: |
          go test -coverprofile=coverage.out ./cmd/... ./internal/...
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 14

      - name: Verify Binary Compilation
        run: go build -ldflags="-w -s" -o bin/api ./cmd/api
