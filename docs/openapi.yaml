openapi: 3.0.3
info:
  title: Enterprise Go REST API Boilerplate
  version: 1.0.0
  description: Production-Ready Go REST API with Clean Architecture, Feature-Driven Slices, JWT Authentication, and RBAC Authorization.

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  # Health Probes
  /health:
    get:
      summary: Overall System Health
      tags: [Health]
      responses:
        '200':
          description: System healthy
        '503':
          description: System unhealthy
  /health/live:
    get:
      summary: Liveness Probe
      tags: [Health]
      responses:
        '200':
          description: Service is live
  /health/ready:
    get:
      summary: Readiness Probe
      tags: [Health]
      responses:
        '200':
          description: Dependencies (MySQL, Redis) are healthy
        '503':
          description: One or more dependencies are unavailable
  /metrics:
    get:
      summary: Prometheus Metrics Scrape Endpoint
      tags: [Observability]
      responses:
        '200':
          description: Prometheus formatted application metrics
          content:
            text/plain:
              schema:
                type: string

  # Authentication Endpoints
  /api/v1/auth/register:
    post:
      summary: Register new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: "securePassword123"
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: Email already exists

  /api/v1/auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: "securePassword123"
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid email or password

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token (with token rotation)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
        '401':
          description: Invalid or expired refresh token

  /api/v1/auth/logout:
    post:
      summary: Logout and revoke refresh token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logged out successfully

  /api/v1/auth/me:
    get:
      summary: Get authenticated user profile
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      status:
                        type: string
                        example: active
                      last_login_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2026-08-24T08:30:15.123456Z"
                      last_activity_at:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2026-08-24T09:15:10.654321Z"
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '401':
          description: Unauthorized

  /api/v1/auth/me/permissions:
    get:
      summary: Get current authenticated user effective permissions
      tags: [RBAC - User]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User effective permissions list
        '401':
          description: Unauthorized

  # RBAC - Role Management
  /api/v1/roles:
    get:
      summary: List roles (paginated)
      tags: [RBAC - Roles]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of roles
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Requires role:read permission)
    post:
      summary: Create new role
      tags: [RBAC - Roles]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "editor"
                description:
                  type: string
                  example: "Content editor"
      responses:
        '201':
          description: Role created successfully
        '400':
          description: Validation error
        '403':
          description: Forbidden (Requires role:create permission)
        '409':
          description: Role name already exists

  /api/v1/roles/{id}:
    get:
      summary: Get role by ID
      tags: [RBAC - Roles]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role details
        '403':
          description: Forbidden (Requires role:read permission)
        '404':
          description: Role not found
    put:
      summary: Update role
      tags: [RBAC - Roles]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "senior-editor"
                description:
                  type: string
                  example: "Senior content editor"
      responses:
        '200':
          description: Role updated successfully
        '403':
          description: Forbidden (Requires role:update permission)
        '404':
          description: Role not found
    delete:
      summary: Delete role (System roles cannot be deleted)
      tags: [RBAC - Roles]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role deleted successfully
        '403':
          description: Forbidden (Requires role:delete permission)
        '422':
          description: Cannot delete system protected role

  /api/v1/roles/{id}/permissions:
    get:
      summary: Get permissions assigned to role
      tags: [RBAC - Roles]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role with assigned permissions
        '403':
          description: Forbidden (Requires role:read permission)
    put:
      summary: Assign permissions to role (Transactional)
      tags: [RBAC - Roles]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_ids]
              properties:
                permission_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Role permissions updated successfully
        '403':
          description: Forbidden (Requires role:update permission)

  # RBAC - Permission Management
  /api/v1/permissions:
    get:
      summary: List permissions (paginated)
      tags: [RBAC - Permissions]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of permissions
        '403':
          description: Forbidden (Requires permission:read permission)
    post:
      summary: Create new permission
      tags: [RBAC - Permissions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, action]
              properties:
                resource:
                  type: string
                  example: "article"
                action:
                  type: string
                  example: "publish"
                description:
                  type: string
                  example: "Publish articles"
      responses:
        '201':
          description: Permission created successfully
        '403':
          description: Forbidden (Requires permission:create permission)
        '409':
          description: Permission already exists

  /api/v1/permissions/{id}:
    get:
      summary: Get permission by ID
      tags: [RBAC - Permissions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Permission details
        '403':
          description: Forbidden (Requires permission:read permission)
        '404':
          description: Permission not found
    put:
      summary: Update permission
      tags: [RBAC - Permissions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, action]
              properties:
                resource:
                  type: string
                action:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Permission updated successfully
        '403':
          description: Forbidden (Requires permission:update permission)
    delete:
      summary: Delete permission
      tags: [RBAC - Permissions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Permission deleted successfully
        '403':
          description: Forbidden (Requires permission:delete permission)

  # RBAC - User Roles Assignment
  /api/v1/users/{id}/roles:
    get:
      summary: Get roles assigned to a user
      tags: [RBAC - User]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of user roles
        '403':
          description: Forbidden (Requires role:read permission)
    put:
      summary: Assign roles to a user (Transactional)
      tags: [RBAC - User]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties:
                role_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: User roles assigned successfully
        '403':
          description: Forbidden (Requires user:assign-role permission)

  /api/v1/users/{id}/permissions:
    get:
      summary: Get effective permissions for a user
      tags: [RBAC - User]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User effective permissions
        '403':
          description: Forbidden (Requires permission:read permission)

  # Articles Module (Canonical Reference Feature)
  /api/v1/articles:
    get:
      summary: List articles (paginated with sorting and filters)
      tags: [Articles]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, title, updated_at, status]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of articles
    post:
      summary: Create new article
      tags: [Articles]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                  example: "Architecting Go Microservices"
                content:
                  type: string
                  example: "Detailed guide to scalable Go backend design."
      responses:
        '201':
          description: Article created successfully
        '400':
          description: Validation error
        '403':
          description: Forbidden (Requires article:create permission)

  /api/v1/articles/{id}:
    get:
      summary: Get article by ID
      tags: [Articles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article details
        '404':
          description: Article not found
    put:
      summary: Update article
      tags: [Articles]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                status:
                  type: string
                  enum: [draft, published, archived]
      responses:
        '200':
          description: Article updated successfully
        '403':
          description: Forbidden (Requires article:update permission or author ownership)
        '404':
          description: Article not found
    delete:
      summary: Delete article
      tags: [Articles]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article deleted successfully
        '403':
          description: Forbidden (Requires article:delete permission or author ownership)
        '404':
          description: Article not found

  /api/v1/articles/slug/{slug}:
    get:
      summary: Get article by slug
      tags: [Articles]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article details
        '404':
          description: Article not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Unique UUID key to safely retry mutation requests without duplicate execution
      required: false
      schema:
        type: string
        format: uuid
  headers:
    X-Trace-ID:
      description: Distributed 128-bit trace ID
      schema:
        type: string
    traceparent:
      description: W3C TraceContext traceparent header (00-{trace_id}-{span_id}-{flags})
      schema:
        type: string
    X-RateLimit-Limit:
      description: Request quota per minute
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Remaining quota in current window
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Timestamp when quota resets
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying (on 429)
      schema:
        type: integer
    X-Idempotent-Replay:
      description: True if response was served directly from idempotency cache
      schema:
        type: boolean
  responses:
    RateLimitExceeded:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "rate limit exceeded, retry after 32 seconds"
    PayloadTooLarge:
      description: Request body exceeds maximum allowed size
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "payload exceeds maximum allowed limit"


